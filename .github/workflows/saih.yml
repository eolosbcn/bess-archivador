# ============================================================================
# CAPTURA DIARIA DEL SAIH
# ============================================================================
# ⚠️ ESTE FICHERO NO ES DE CASANDRA. Va en `eolosbcn/bess-archivador`, en
# `.github/workflows/saih.yml`. Esta copia en `Casandra\` existe para que quede
# bajo git y para poder leerla sin abrir GitHub. La que manda es la desplegada.
#
# QUÉ HACE
# --------
# Ejecuta `saih_captura.py`, que baja del Sistema Automático de Información
# Hidrológica del Ebro el volumen embalsado de cada embalse y los aforos de la
# cuenca, y los archiva en `archivo_saih/`.
#
# POR QUÉ ES URGENTE, Y ES LO ÚNICO QUE LO ES
# --------------------------------------------
# ⚠️⚠️ El SAIH del Ebro sirve **365 días por API y lo anterior solo por
# correo**. De todo lo que se descubrió el 8-sep-2026 sobre la hidráulica, la
# captura es **lo único que se degrada si se espera**: el conocimiento aguanta,
# la historia no se recupera. Criterio de Xevi: «a partir de ahora podemos
# recopilar las muestras cada día, así que el aprendizaje crecerá».
#
# ⚠️ POR QUÉ ES UN WORKFLOW APARTE Y NO PARTE DEL ARCHIVADOR
# -----------------------------------------------------------
# El archivador produce la única pieza irreproducible del proyecto, y añadirle
# fuentes con otra cadencia significaría tocarlo. Este vive aparte, escribe en
# su propia carpeta y **no puede romper el archivo existente**.
#
# ⚠️ Y NO NACE SIENDO UN PUNTO CIEGO, que es lo que Xevi pidió evitar: su
# `indice.csv` tiene el MISMO FORMATO que el del archivador, así que
# `vigilante.py` puede vigilarlo **sin una línea de código nueva**, apuntándolo
# con `--raiz archivo_saih`. ✅ Comprobado el 8-sep-2026: el vigilante lee la
# captura y ve sus dos fuentes.
#
# ⚠️ QUIÉN LO DISPARA: cron-job.org, con el cron de GitHub como RED
# ------------------------------------------------------------------
# **El disparo principal es cron-job.org**, igual que el del archivador, por
# `workflow_dispatch`. ✅ Medido: cron-job.org lleva **88 de 88** disparos en
# 11 días completos, con hueco máximo de 3,02 h; el cron de GitHub entrega
# entre el **42 % y el 67 %** (del 14 al 26-ago-2026, ver `archivador.yml`).
#
# ⚠️ Y la aritmética es lo que decide, no la media: con TRES pasadas de GitHub
# al día, la probabilidad de que **no llegue ninguna** es 0,58³ = **19,5 %** al
# 42 % de entrega. Un día de cada cinco sin captura — y en una serie que solo
# se puede construir hacia adelante, un día perdido no se recupera nunca.
#
# ⚠️⚠️ PERO AQUÍ NO SE DESACTIVA EL CRON DE GITHUB, Y ESO ES UNA DIFERENCIA
# DELIBERADA CON EL ARCHIVADOR. Aquél lo comentó entero el 28-ago-2026 porque
# **capturar el mercado exige puntualidad** —a las 11:50, antes del cierre de
# ofertas—, así que un disparo impuntual puede ser PEOR que ninguno: coge el
# dato en el momento equivocado.
#
# El SAIH no tiene esa restricción: **da igual a qué hora del día se coja**.
# Un respaldo impuntual es ganancia pura, y cubre el caso de que cron-job.org
# falle o su token caduque. Por eso se deja **una al día** como red — ni tres,
# que sería redundante, ni ninguna, que dejaría todo colgando de un servicio
# gratuito de terceros.
#
# CÓMO SE CONFIGURA EN cron-job.org (misma receta que el archivador, ver
# `guia_cron_externo_*` de Casandra; ⚠️ NO hace falta un token nuevo: el
# `cron-archivador` es fine-grained con Actions en escritura sobre este
# repositorio, y eso cubre TODOS sus workflows):
#
#   URL     https://api.github.com/repos/eolosbcn/bess-archivador/actions/workflows/saih.yml/dispatches
#   Método  POST
#   Cabeceras   Accept: application/vnd.github+json
#               Authorization: Bearer <el token cron-archivador>
#   Cuerpo  {"ref":"main"}
#   Hora    09:15 de Madrid — las lecturas de embalse se toman sobre las 8:00
#
# COSTE
# -----
# 2 ejecuciones al día de ~30 s —una de cron-job.org y la red de GitHub—. El
# repositorio es **público**, así que GitHub
# no cobra minutos de Actions (confirmado por Xevi el 8-sep-2026). ⚠️ Si algún
# día pasa a privado, esto vuelve a costar y habría que revisarlo.
# ============================================================================

name: Captura del SAIH

on:
  # ⚠️⚠️ EL `schedule` ESTÁ DESACTIVADO DESDE EL 8-sep-2026, Y NO POR GUSTO:
  # **`saihebro.com` NO ES ALCANZABLE DESDE LOS RUNNERS DE GITHUB.**
  #
  # ✅ Medido sobre DOS ejecuciones independientes (#1 a las 19:37 y #2 a las
  # 19:48): `ConnectTimeout` en los dos endpoints, las dos veces, con la
  # ejecución tardando **279 s** en esperar conexiones que no llegan. Desde la
  # IP residencial de Xevi el mismo servidor responde **HTTP 200 en 0,5 s**.
  #
  # ⚠️ Y el certificado NO era el problema: el intermedio de la FNMT sí se
  # descargó, porque `cert.fnmt.es` está en una CDN de Akamai (23.43.x.x) que
  # responde desde cualquier parte, mientras `saihebro.com` es una IP única y
  # directa del Estado (192.148.213.77). La causa más probable es que bloquee
  # rangos de centros de datos o IPs de fuera de España.
  #
  # Con el `schedule` puesto, cada día habría una ejecución de 279 s que falla,
  # escribe una captura vacía y hace que el vigilante avise de una fuente muda
  # cuya causa ya conocemos. **Un aviso que se sabe de antemano enseña a
  # ignorar los avisos**, que es justo lo que no queremos.
  #
  # ⚠️ LO QUE ESTO NO SIGNIFICA: que los datos se pierdan. La API sirve los
  # **últimos 365 días**, así que mientras se vuelva dentro del año no se
  # pierde nada. La ruta buena es descargar el histórico desde la máquina de
  # Xevi, que sí llega, y refrescarlo de vez en cuando. La urgencia que
  # parecía haber venía de suponer que solo se podía capturar el día en curso.
  #
  # Se deja `workflow_dispatch` para poder reintentarlo con un clic el día que
  # el bloqueo se levante — y ahora cuesta 20 s, no cinco minutos.
  #
  # schedule:
  #   - cron: "47 19 * * *"

  workflow_dispatch:

  # Al tocar el propio capturador, para que se pruebe solo al desplegarlo.
  # ⚠️ Estas rutas son las SUYAS: no incluyen `archivador_diario.py` ni
  # `vigilante.py`, o cada despliegue de aquéllos dispararía también a éste.
  push:
    paths:
      - "saih_captura.py"
      - ".github/workflows/saih.yml"

# ⚠️ Necesita ESCRIBIR, al revés que el vigilante: su trabajo es archivar.
# Por eso está separado de él — el vigilante conserva `contents: read` y la
# garantía de que un fallo suyo no puede tocar el archivo.
permissions:
  contents: write

# ⚠️ Grupo PROPIO. Si compartiera el del archivador se quedaría esperando
# detrás de una captura completa —25-30 minutos— sin ninguna necesidad.
concurrency:
  group: saih
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    # Generoso: la captura real tarda ~10 s. Si se acerca a esto, algo va mal.
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ `certifi` es imprescindible y no es decorativo: `saihebro.com` no
      # envía su certificado intermedio, así que hay que montar un paquete de
      # CA con `certifi` + el intermedio de la FNMT. Sin él la captura FALLA a
      # propósito, en vez de seguir con la verificación desactivada.
      - name: Instalar dependencias
        run: pip install --quiet requests certifi

      - name: Capturar el SAIH del Ebro
        run: |
          set -euo pipefail
          {
            echo "### Captura del SAIH"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          python saih_captura.py --raiz archivo_saih 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar lo capturado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ⚠️ Se añade SOLO `archivo_saih/`, por ruta explícita. Un `git add -A`
          # se llevaría dentro cualquier cosa que otro proceso hubiera dejado a
          # medias en el runner.
          git add archivo_saih

          # ⚠️ Si no hay nada que guardar, NO se falla: que la captura no haya
          # cambiado nada es información, no una avería. Quien avisa de que el
          # archivo no avanza es el vigilante, leyendo el índice.
          if git diff --cached --quiet; then
            echo "::notice::Nada nuevo que guardar en esta pasada"
            exit 0
          fi

          git commit -m "SAIH: captura de $(date -u +%Y-%m-%d\ %H:%M) UTC"

          # ⚠️ Rebase antes de empujar: el archivador escribe en el mismo
          # repositorio y puede haber committeado entre medias. Sin esto, el
          # push falla y se pierde la captura del día.
          git pull --rebase --autostash origin main
          git push origin main

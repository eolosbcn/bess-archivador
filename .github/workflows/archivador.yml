name: Archivador diario BESS

# Tres formas de dispararse:
#   1. Automática, cada hora (ver el cron de abajo).
#   2. A mano desde la app de GitHub en el móvil o desde la web.
#   3. Al tocar el script, para probar que sigue funcionando.
on:
  # schedule:
    # CADA HORA, temporalmente. Medido el 11-ago-2026: las previsiones de
    # renovables se regeneran cada hora hacia el minuto 40, no cada 3 horas
    # como se suponía. Durante unas semanas se pide cada hora para
    # caracterizarlo; después bastará con una o dos capturas al día.
    #
    # OJO: el cron de GitHub Actions va SIEMPRE en UTC, es NOTORIAMENTE
    # IMPUNTUAL —15 a 30 minutos de retraso es lo normal— y además DESCARTA
    # ejecuciones cuando hay carga: el 11-ago-2026 solo corrieron 2 de las ~8
    # programadas. Pedir cada hora es la forma de acabar teniendo varias
    # capturas al día, no de tener 24.
    #
    # Se pide en el minuto 45 por dos razones: cae justo después del refresco
    # del minuto 40, y evita el pico de peticiones de las horas en punto, que
    # es cuando GitHub más descarta.
    #
    # Para volver a cada 3 horas cuando toque:
    #   - cron: "45 0,3,6,9,12,15,18,21 * * *"
    # - cron: "45 * * * *"
  # DESACTIVADO el 28-ago-2026: el cron de GitHub es impuntual y descarta
  # ejecuciones. El disparo lo hace cron-job.org por workflow_dispatch, que
  # entra por otra cola. Ver guia_cron_externo.
  workflow_dispatch:        # botón "Run workflow" (también desde el móvil)
  push:
    paths:
      - "archivador_diario.py"
      - ".github/workflows/archivador.yml"

# El workflow escribe en el propio repositorio: necesita permiso explícito.
permissions:
  contents: write

# Si una ejecución se solapa con otra, que espere en vez de pisarla: dos
# procesos haciendo commit a la vez es un conflicto seguro.
concurrency:
  group: archivador
  cancel-in-progress: false

jobs:
  archivar:
    runs-on: ubuntu-latest
    # Holgado a propósito. Una captura ligera (solo las ~110 previsiones) ronda
    # los 2-3 minutos; la completa del día recorre además los ~1.400 programas
    # de generación a ~1 petición/segundo, así que puede irse a 25-30 minutos.
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests pandas openpyxl

      - name: Capturar la foto del día
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          AEMET_TOKEN: ${{ secrets.AEMET_TOKEN }}
        run: python archivador_diario.py

      - name: Guardar en el repositorio
        run: |
          git config user.name  "archivador-bess"
          git config user.email "archivador@users.noreply.github.com"
          git add archivo/
          # Si no hay nada nuevo, no se hace commit y no es un error.
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "Archivo del $(date -u +%Y-%m-%d) ($(date -u +%H:%M) UTC)"
          # Reintento simple: si otra ejecución hizo push mientras tanto,
          # se reintegra y se vuelve a intentar en vez de fallar.
          for intento in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $intento). Reintegrando..."
            git pull --rebase --autostash
            sleep 5
          done
          echo "No se pudo hacer push tras 3 intentos."
          exit 1

      - name: Publicar la salida como resumen
        if: always()
        run: |
          # Se busca el manifiesto MÁS RECIENTE en vez de construir su ruta a
          # mano: desde la v3 vive en una subcarpeta con la hora de captura.
          RUTA=$(find archivo -name 'manifiesto.json' -printf '%T@ %p\n' 2>/dev/null \
                 | sort -rn | head -1 | cut -d' ' -f2-)
          echo "### Archivador — $(date -u +'%Y-%m-%d %H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RUTA" ] && [ -f "$RUTA" ]; then
            echo "Fichero: \`$RUTA\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$RUTA" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No se generó manifiesto: la ejecución falló antes de empezar." >> $GITHUB_STEP_SUMMARY
          fi
